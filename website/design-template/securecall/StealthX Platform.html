<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StealthX — Plattform-Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; }
  :root {
    --font-display: "Schibsted Grotesk", system-ui, sans-serif;
    --font-text: "Hanken Grotesk", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  .app {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    line-height: 1.55;
    font-size: 16.5px;
    transition: background .4s ease, color .4s ease;
    overflow-x: hidden;
  }
  .app em { font-style: normal; color: var(--accent); }
  ::selection { background: color-mix(in oklch, var(--accent) 36%, transparent); }
  a { color: inherit; text-decoration: none; }

  .wrap, .nav-inner, .section, .cta-inner, .footer { }
  .section { max-width: 1140px; margin: 0 auto; padding: 110px 28px; }
  .section-alt { background: var(--surface); max-width: none; }
  .section-alt > * { max-width: 1140px; margin-left: auto; margin-right: auto; }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--font-text); font-weight: 600; font-size: 14.5px; letter-spacing: -0.01em;
    padding: 11px 20px; border-radius: 11px; cursor: pointer; border: 1px solid transparent;
    transition: transform .15s ease, background .2s ease, border-color .2s ease, color .2s; white-space: nowrap; }
  .btn:hover { transform: translateY(-1px); }
  .btn-lg { padding: 14px 26px; font-size: 15.5px; border-radius: 13px; }
  .btn-block { width: 100%; }
  .btn-solid { background: var(--accent); color: var(--on-accent); }
  .btn-solid:hover { background: color-mix(in oklch, var(--accent) 88%, white); }
  .btn-line { border-color: var(--line-strong); color: var(--text); background: transparent; }
  .btn-line:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost { background: var(--surface-2); color: var(--text); }
  .btn-ghost:hover { background: color-mix(in oklch, var(--surface-2) 70%, var(--accent)); }

  .mono { font-family: var(--font-mono); }

  /* ---------- nav ---------- */
  .nav { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(16px);
    background: color-mix(in oklch, var(--bg) 78%, transparent);
    border-bottom: 1px solid var(--line); }
  .nav-inner { max-width: 1140px; margin: 0 auto; padding: 12px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .nav-links { display: flex; gap: 26px; }
  .nav-link { font-size: 14.5px; color: var(--text-dim); font-weight: 500; transition: color .2s; }
  .nav-link:hover { color: var(--text); }
  .nav-cta { display: flex; gap: 10px; align-items: center; }
  .lang-switch { display: inline-flex; gap: 2px; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .lang-btn { border: none; background: transparent; color: var(--text-faint); font-family: var(--font-text);
    font-weight: 700; font-size: 11.5px; letter-spacing: .03em; padding: 5px 9px; border-radius: 999px; cursor: pointer; transition: .2s; }
  .lang-btn.on { background: var(--surface-2); color: var(--text); }
  .lang-btn:hover { color: var(--text); }

  /* ---------- hero ---------- */
  .hero { max-width: 1140px; margin: 0 auto; padding: 96px 28px 70px; }
  .hero-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 56px; align-items: center; }
  .eyebrow { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600;
    color: var(--text-dim); letter-spacing: .01em; padding: 7px 15px; border: 1px solid var(--line);
    border-radius: 999px; margin-bottom: 28px; white-space: nowrap; }
  .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 22%, transparent); }
  .hero-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(38px, 5.4vw, 66px);
    line-height: 1.02; letter-spacing: -0.035em; margin: 0 0 22px; text-wrap: balance; }
  .hero-sub { font-size: 18.5px; color: var(--text-dim); max-width: 30em; margin: 0 0 32px; text-wrap: pretty; }
  .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
  .hero-trust { display: flex; gap: 22px; flex-wrap: wrap; }
  .hero-trust-item { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-faint); white-space: nowrap; }
  .tick, .pf-tick { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
    background: color-mix(in oklch, var(--accent) 18%, transparent); }
  .tick::after, .pf-tick::after { content: "✓"; font-size: 9px; color: var(--accent); font-weight: 800; }

  /* hero panel */
  .hero-panel { position: relative; display: flex; flex-direction: column; }
  .hp-glow { position: absolute; inset: -10% -6% -10% -6%; border-radius: 40px; z-index: 0;
    background: radial-gradient(60% 60% at 70% 30%, color-mix(in oklch, var(--accent) 24%, transparent), transparent 70%);
    filter: blur(20px); }
  .hp-card { position: relative; z-index: 1; background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 22px; padding: 22px; box-shadow: 0 30px 70px -30px rgba(0,0,0,.6); }
  .hp-head { display: flex; align-items: center; gap: 13px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .hp-mark { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
    background: color-mix(in oklch, var(--accent) 14%, transparent); color: var(--text); }
  .hp-title { font-weight: 700; font-size: 15px; }
  .hp-mono { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); white-space: nowrap; }
  .hp-live { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12px;
    color: var(--accent); font-weight: 600; }
  .hp-livedot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .hp-wave { display: flex; align-items: center; gap: 3px; height: 64px; padding: 22px 0; }
  .hp-wave span { flex: 1; border-radius: 3px; background: linear-gradient(var(--accent), color-mix(in oklch, var(--accent) 40%, transparent));
    animation: eq 1.4s ease-in-out infinite; opacity: .85; }
  .hp-wave span:nth-child(odd) { animation-delay: .2s; }
  .hp-wave span:nth-child(3n) { animation-delay: .45s; }
  @keyframes eq { 0%,100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
  .hp-rows { display: grid; gap: 11px; padding-top: 18px; border-top: 1px solid var(--line); }
  .hp-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; font-size: 13.5px; }
  .hp-k { color: var(--text-dim); white-space: nowrap; }
  .hp-v { font-family: var(--font-mono); font-size: 12px; color: var(--text); white-space: nowrap; }
  .hp-rows { display: grid; gap: 11px; padding-top: 18px; border-top: 1px solid var(--line); }
  .hp-badge { align-self: flex-end; margin-top: 14px; z-index: 2; background: var(--bg);
    border: 1px solid var(--line-strong); border-radius: 13px; padding: 11px 16px; display: inline-flex;
    align-items: center; gap: 11px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.6); }
  .hp-badge-num { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--accent); line-height: 1; }
  .hp-badge-lbl { font-size: 11.5px; color: var(--text-faint); }

  /* ---------- section heads ---------- */
  .section-head { max-width: 680px; margin-bottom: 52px; }
  .kicker { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; }
  .section-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 3.4vw, 42px);
    letter-spacing: -0.03em; margin: 14px 0 16px; line-height: 1.06; }
  .section-lead { font-size: 17.5px; color: var(--text-dim); margin: 0; text-wrap: pretty; }

  /* ---------- products ---------- */
  .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .product-card { display: flex; flex-direction: column; gap: 14px; padding: 26px; border-radius: 18px;
    background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden;
    transition: transform .2s ease, border-color .2s ease, box-shadow .25s ease; }
  .product-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--pa); opacity: .8; }
  .product-card:hover { transform: translateY(-4px); border-color: color-mix(in oklch, var(--pa) 55%, var(--line));
    box-shadow: 0 24px 60px -34px color-mix(in oklch, var(--pa) 60%, transparent); }
  .pc-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .pc-status { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); text-align: right;
    border: 1px solid var(--line); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .pc-name { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .pc-tag { font-size: 13px; color: var(--pa); font-weight: 600; margin-top: -8px; }
  .pc-line { font-size: 14.5px; color: var(--text-dim); margin: 0; }
  .pc-points { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 8px; }
  .pc-points li { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--text-dim); }
  .pc-bullet { width: 6px; height: 6px; border-radius: 50%; background: var(--pa); flex: none; }
  .pc-more { margin-top: auto; padding-top: 8px; font-weight: 600; font-size: 14px; color: var(--text);
    display: inline-flex; align-items: center; gap: 7px; }
  .pc-arrow { transition: transform .2s; }
  .product-card:hover .pc-arrow { transform: translateX(4px); }

  .suite-teaser { margin-top: 22px; display: flex; align-items: center; gap: 24px; padding: 24px 28px;
    border: 1px solid var(--line-strong); border-radius: 18px; background: var(--surface);
    background-image: linear-gradient(120deg, color-mix(in oklch, var(--accent) 9%, transparent), transparent 60%); }
  .suite-marks { display: flex; }
  .suite-marks > * { margin-left: -8px; }
  .suite-marks > *:first-child { margin-left: 0; }
  .suite-body { flex: 1; }
  .suite-kicker { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
  .suite-text { margin: 4px 0 0; font-size: 14.5px; color: var(--text-dim); }

  /* ---------- trust ---------- */
  .trust-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 36px; }
  .tstat { text-align: center; padding: 22px 14px; border: 1px solid var(--line); border-radius: 15px; background: var(--bg); }
  .tstat-n { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--accent); letter-spacing: -0.03em; }
  .tstat-l { font-size: 13px; color: var(--text-faint); margin-top: 4px; }
  .spec-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .spec { padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
  .spec-k { font-size: 12.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .08em; }
  .spec-v { font-size: 16px; font-weight: 600; margin: 6px 0 4px; color: var(--text); }
  .spec-d { font-size: 13px; color: var(--text-dim); }

  /* ---------- compare ---------- */
  .cmp-wrap { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .cmp { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  .cmp th, .cmp td { padding: 15px 18px; text-align: left; border-bottom: 1px solid var(--line); }
  .cmp thead th { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--text-dim); background: var(--surface); }
  .cmp th.cmp-own, .cmp td.cmp-own { text-align: center; background: color-mix(in oklch, var(--accent) 8%, transparent); }
  .cmp thead th.cmp-own { color: var(--accent); }
  .cmp td:not(:first-child) { text-align: center; }
  .cmp tbody tr:last-child td { border-bottom: none; }
  .cmp-legend { display: flex; gap: 20px; margin-top: 12px; font-size: 12.5px; color: var(--text-faint); flex-wrap: wrap; }
  .cmp-legend > span { white-space: nowrap; }
  .cmp-legend .cmp-yes, .cmp-legend .cmp-warn, .cmp-legend .cmp-no { margin-right: 5px; }
  .cmp-yes { color: var(--accent); font-weight: 800; }
  .cmp-no { color: var(--text-faint); }
  .cmp-warn { color: color-mix(in oklch, var(--cham) 80%, var(--text)); font-weight: 700; }

  /* ---------- pricing ---------- */
  .bill-toggle { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px;
    margin-bottom: 30px; background: var(--bg); }
  .bt { border: none; background: transparent; color: var(--text-dim); font-family: var(--font-text); font-weight: 600;
    font-size: 13.5px; padding: 8px 16px; border-radius: 999px; cursor: pointer; transition: .2s; white-space: nowrap; }
  .bt.on { background: var(--accent); color: var(--on-accent); }
  .price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .price-card { position: relative; padding: 28px; border: 1px solid var(--line); border-radius: 18px; background: var(--bg);
    display: flex; flex-direction: column; gap: 6px; }
  .price-card.best { border-color: var(--accent); box-shadow: 0 24px 60px -36px color-mix(in oklch, var(--accent) 70%, transparent); }
  .price-flag { position: absolute; top: -11px; left: 28px; background: var(--accent); color: var(--on-accent);
    font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; }
  .price-name { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
  .price-row { display: flex; align-items: baseline; gap: 4px; }
  .price-amt { font-family: var(--font-display); font-weight: 800; font-size: 38px; letter-spacing: -0.03em; }
  .price-per { font-size: 14px; color: var(--text-faint); }
  .price-note { font-size: 13px; color: var(--text-faint); margin-bottom: 12px; }
  .price-feats { list-style: none; padding: 16px 0 22px; margin: 0; display: grid; gap: 11px; border-top: 1px solid var(--line); }
  .price-feats li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-dim); }
  .price-card .btn { margin-top: auto; }

  .suite-card { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 28px;
    flex-wrap: wrap; padding: 26px 30px; border-radius: 18px; border: 1px solid var(--line-strong);
    background: linear-gradient(110deg, color-mix(in oklch, var(--accent) 12%, var(--bg)), var(--bg)); }
  .suite-card-l { display: flex; align-items: center; gap: 20px; }
  .suite-card-r { display: flex; align-items: center; gap: 20px; }
  .suite-price { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.03em; white-space: nowrap; }
  .suite-price span { font-size: 14px; font-weight: 500; color: var(--text-faint); }

  /* ---------- brand system ---------- */
  .brand-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .brand-cell { text-align: center; padding: 30px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .brand-cell.brand-master { border-color: var(--line-strong); background: linear-gradient(160deg, color-mix(in oklch, var(--accent) 7%, var(--surface)), var(--surface)); }
  .brand-mark { display: grid; place-items: center; height: 78px; }
  .brand-n { font-family: var(--font-display); font-weight: 700; font-size: 16px; margin-top: 6px; }
  .brand-d { font-size: 12.5px; color: var(--text-faint); }
  .brand-rows { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .brand-row { display: grid; grid-template-columns: 160px 1fr; gap: 20px; padding: 24px 26px; border-bottom: 1px solid var(--line); align-items: center; }
  .brand-row:last-child { border-bottom: none; }
  .brand-row-l { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); }
  .brand-row-r { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .brand-note { font-size: 13px; color: var(--text-faint); }
  .swatches { flex-direction: row; gap: 22px; flex-wrap: wrap; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .sw-chip { width: 26px; height: 26px; border-radius: 8px; display: block; box-shadow: inset 0 0 0 1px var(--line-strong); }
  .sw-l { font-size: 13px; color: var(--text-dim); }
  .type-spec { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }

  /* ---------- cta ---------- */
  .cta { padding: 110px 28px; text-align: center;
    background: radial-gradient(70% 120% at 50% 0%, color-mix(in oklch, var(--accent) 16%, var(--bg)), var(--bg) 70%); }
  .cta-inner { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cta-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4vw, 46px); letter-spacing: -0.03em; margin: 16px 0 6px; }
  .cta-sub { font-size: 18px; color: var(--text-dim); margin: 0 0 12px; max-width: 30em; }
  .cta-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .cta-fine { font-size: 13px; color: var(--text-faint); margin-top: 14px; }

  /* ---------- footer ---------- */
  .footer { border-top: 1px solid var(--line); padding: 60px 28px 36px; background: var(--surface); }
  .footer-top { max-width: 1140px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr 2fr; gap: 40px; padding-bottom: 40px; border-bottom: 1px solid var(--line); }
  .footer-tag { color: var(--text-faint); font-size: 14px; margin: 14px 0 0; }
  .footer-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .footer-h { font-family: var(--font-display); font-weight: 600; font-size: 14px; margin-bottom: 12px; }
  .footer-link { display: block; font-size: 14px; color: var(--text-dim); padding: 5px 0; transition: color .2s; }
  .footer-link:hover { color: var(--accent); }
  .footer-bottom { max-width: 1140px; margin: 22px auto 0; display: flex; justify-content: space-between; gap: 16px;
    font-size: 13px; color: var(--text-faint); flex-wrap: wrap; }

  /* ---------- responsive ---------- */
  @media (max-width: 940px) {
    .hero-grid { grid-template-columns: 1fr; gap: 48px; }
    .product-grid, .price-grid, .spec-grid, .trust-stats { grid-template-columns: repeat(2, 1fr); }
    .brand-grid { grid-template-columns: repeat(2, 1fr); }
    .nav-links { display: none; }
    .footer-top { grid-template-columns: 1fr; }
  }
  @media (max-width: 620px) {
    .section { padding: 72px 20px; }
    .product-grid, .price-grid, .spec-grid, .trust-stats, .brand-grid { grid-template-columns: 1fr; }
    .nav-cta .btn-ghost { display: none; }
    .suite-teaser, .suite-card { flex-direction: column; align-items: flex-start; }
    .footer-cols { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="i18n.jsx"></script>
<script type="text/babel" src="brand.jsx"></script>
<script type="text/babel" src="sections1.jsx"></script>
<script type="text/babel" src="sections2.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>

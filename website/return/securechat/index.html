<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Returning to SecureChat...</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: #0a0a12; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  padding: 24px;
}
.card {
  width: 100%; max-width: 440px; border: 1px solid #1f2330; border-radius: 12px; background: #11131a;
  padding: 24px; text-align: center;
}
h1 { margin: 0 0 12px; color: #ff4444; font-size: 24px; }
p { color: #aaa; line-height: 1.5; }
a {
  display: block; margin-top: 18px; padding: 14px; border-radius: 8px; background: #00c853; color: #06120b;
  text-decoration: none; font-weight: 700;
}
</style>
</head>
<body>
  <div class="card">
    <h1>Returning to SecureChat...</h1>
    <p>If the app does not open automatically, use the button below.</p>
    <a id="fallback" href="#">Open SecureChat</a>
  </div>
<script>
const params = new URLSearchParams(window.location.search);
const query = new URLSearchParams({
  app: 'securechat',
  address: params.get('address') || params.get('addr') || '',
  addr: params.get('address') || params.get('addr') || '',
  signature: params.get('signature') || params.get('sig') || '',
  sig: params.get('signature') || params.get('sig') || '',
  nonce: params.get('nonce') || '',
  deviceId: params.get('deviceId') || '',
  returnPackage: params.get('returnPackage') || params.get('package') || 'com.stealthx.securechat'
}).toString();
const pkg = params.get('returnPackage') || params.get('package') || 'com.stealthx.securechat';
document.getElementById('fallback').href =
  'intent://stealthx.tech/return/securechat?' + query +
  '#Intent;scheme=https;package=' + encodeURIComponent(pkg) +
  ';action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end';
</script>
</body>
</html>

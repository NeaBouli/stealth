<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4444"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
  </g>

  <!-- Lock Icon -->
  <g transform="translate(540, 120)">
    <rect x="25" y="50" width="70" height="60" rx="8" fill="none" stroke="#FF4444" stroke-width="4"/>
    <path d="M40,50 V35 A20,20 0 0,1 80,35 V50" fill="none" stroke="#FF4444" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="80" r="6" fill="#FF4444"/>
    <line x1="60" y1="86" x2="60" y2="96" stroke="#FF4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- App Name -->
  <text x="600" y="280" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff">SecureCall</text>

  <!-- Tagline -->
  <text x="600" y="340" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="400" fill="url(#accent)">Encrypted Calls. Zero Metadata.</text>

  <!-- Subtitle -->
  <text x="600" y="400" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="20" fill="#888888">End-to-end encrypted voice calls for Android</text>

  <!-- Feature pills -->
  <g transform="translate(600, 460)" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#aaaaaa">
    <rect x="-380" y="-15" width="120" height="30" rx="15" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
    <text x="-320" y="5">E2E Encrypted</text>

    <rect x="-230" y="-15" width="130" height="30" rx="15" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
    <text x="-165" y="5">WireGuard VPN</text>

    <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
    <text x="0" y="5">No Phone Number</text>

    <rect x="100" y="-15" width="120" height="30" rx="15" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
    <text x="160" y="5">Zero Metadata</text>

    <rect x="250" y="-15" width="110" height="30" rx="15" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
    <text x="305" y="5">Open Source</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="560" width="1200" height="70" fill="#111122"/>
  <text x="60" y="600" font-family="Inter, sans-serif" font-size="16" fill="#666666">Vendetta Labs — Greece</text>
  <text x="1140" y="600" text-anchor="end" font-family="Inter, sans-serif" font-size="16" fill="#666666">github.com/NeaBouli/stealth</text>
</svg>

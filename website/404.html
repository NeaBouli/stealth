<!DOCTYPE html>
<html lang="en">
<head>
    <script>
    // Domain guard
    if(window.location.hostname!=="stealthx.tech"&&window.location.hostname!=="www.stealthx.tech"&&window.location.hostname!=="localhost"&&window.location.hostname!=="127.0.0.1"){window.location.replace("https://stealthx.tech"+window.location.pathname);}
    // SPA Router: redirect /invite/{id} to invite.html
    (function(){
        var path = window.location.pathname;
        if (path.match(/^\/invite\/[a-zA-Z0-9_-]+$/)) {
            // Redirect to invite.html with the ID preserved in the path
            // invite.html reads the ID from window.location.pathname
            window.location.replace('/invite.html' + window.location.search + '#' + path.split('/').pop());
        }
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

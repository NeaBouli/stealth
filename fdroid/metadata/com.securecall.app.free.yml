AutoName: SecureCall
Summary: End-to-end encrypted voice calls. Zero metadata.
Description: |-
  SecureCall is a privacy-first voice communication app built
  on the StealthX Platform. No phone number required. No account.
  No metadata stored.

  End-to-end encrypted using XChaCha20-Poly1305 with X25519 key
  exchange and Double Ratchet forward secrecy. Rust cryptography
  core via JNI.

  Features:
  * End-to-end encrypted calls (XChaCha20-Poly1305)
  * No phone number or account required
  * STEALTH-DELETE: 5-tap emergency wipe
  * Built-in WireGuard VPN (Premium)
  * Anti-recording protection
  * GPL-3.0 open source

  Part of the StealthX Platform (stealthx.tech).

RepoType: git
Repo: https://github.com/NeaBouli/stealth.git

Builds:
  - versionName: 1.0.21
    versionCode: 42
    commit: v1.0.21-fdroid
    subdir: client_android/app
    sudo:
      - apt-get update -y
      - apt-get install -y curl build-essential
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain
        stable --no-modify-path
      - /root/.cargo/bin/rustup target add aarch64-linux-android armv7-linux-androideabi
        x86_64-linux-android
      - /root/.cargo/bin/cargo install cargo-ndk --version "^3"
      - cp -r /root/.cargo /home/vagrant/.cargo
      - cp -r /root/.rustup /home/vagrant/.rustup
      - chown -R vagrant:vagrant /home/vagrant/.cargo /home/vagrant/.rustup
    gradle:
      - free
    prebuild:
      - printf 'org.gradle.jvmargs=-Xmx2048m
        -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.enableJetifier=true\nandroid.enableGlobalSynthetics=true\n'
        > ../gradle.properties
      - echo sdk.dir=/opt/android-sdk > ../local.properties
      - sed -i "s/apply plugin.*crashlytics.*//g" ../build.gradle || true
      - sed -i "s/com.google.firebase.crashlytics.*//g" ../build.gradle || true
      - cd ../../core_crypto && /home/vagrant/.cargo/bin/cargo ndk -t arm64-v8a -t
        armeabi-v7a -t x86_64 -o ../client_android/app/src/main/jniLibs build --release
    scanignore:
      - client_android/build.gradle
    scandelete:
      - client_android/app/src/main/jniLibs/
      - core_crypto/target/
    ndk: 27.0.12077973


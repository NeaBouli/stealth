AutoName: SecureCall
Description: |
  SecureCall is a privacy-first encrypted calling app.
  No phone number, no account, no personal data required.

  Features:
  * XChaCha20-Poly1305 end-to-end encryption
  * X25519 key exchange + DTLS-SRTP media transport
  * No phone number required - identified by SecureID
  * Custom Call ID support
  * STEALTH-DELETE: 5-tap emergency data wipe
  * Emergency Broadcast System
  * WalletConnect v2 for IFR token verification
  * 30-day free trial (F-Droid edition)
  * Unlock with activation code or IFR token lock
  * No ads, no tracking, no telemetry

  F-Droid Edition:
  This build contains no proprietary libraries - no Google Play
  Services, no Firebase, no AdMob, no Crashlytics.
  After 30 days, unlock outgoing calls with an activation code
  or by locking IFR tokens via WalletConnect.

RepoType: git
Repo: https://github.com/NeaBouli/stealth.git

Builds:
  - versionName: 1.0.23
    versionCode: 44
    commit: v1.0.23
    subdir: client_android/app
    sudo:
      - apt-get update -y
      - apt-get install -y build-essential rustc cargo
    prebuild:
      - printf 'org.gradle.jvmargs=-Xmx2048m
        -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.enableJetifier=true\nandroid.enableGlobalSynthetics=true\n'
        > ../gradle.properties
      - echo sdk.dir=/opt/android-sdk > ../local.properties
      - sed -i "s/apply plugin.*crashlytics.*//g" ../build.gradle || true
      - sed -i "s/com.google.firebase.crashlytics.*//g" ../build.gradle || true
      - cargo install cargo-ndk --version "^3"
      - cd ../../core_crypto && cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64
        -o ../client_android/app/src/main/jniLibs build --release
    gradle:
      - fdroid
    output: build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
    antifeatures:
      KnownVuln:
        en-US: Uses older WebRTC version — planned upgrade in v1.1
    scanignore:
      - client_android/build.gradle
    scandelete:
      - client_android/app/src/main/jniLibs/
      - core_crypto/target/
    ndk: 27.0.12077973

AutoUpdateMode: Version
UpdateCheckMode: Tags

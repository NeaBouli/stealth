AutoName: SecureCall

Summary: Encrypted P2P calls with no phone number required

Description: |
  SecureCall is a privacy-first encrypted calling app.

  Features:
  * End-to-end encrypted calls (X25519 + DTLS-SRTP)
  * No phone number required — identified by SecureID
  * Built-in WireGuard VPN (Premium)
  * STEALTH-DELETE emergency data wipe
  * Emergency Broadcast System
  * No ads, no tracking, no telemetry

  This F-Droid build contains no proprietary libraries:
  no Google Play Services, no Firebase, no AdMob.


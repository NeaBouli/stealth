apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// App Bundles perform ABI splitting in Google Play. Building APK splits at the
// same time breaks resource shrinking with AGP 8.11.
def buildingAppBundle = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('bundle')
}

// Guard: pro and premium flavors are internal-only (testing, not distribution).
// They are excluded from the build unless -Pinternal is passed on the command line.
//   Normal:   ./gradlew assembleFreeRelease        → builds
//             ./gradlew assembleProRelease         → task does not exist
//   Internal: ./gradlew -Pinternal assembleProDebug → builds
def allowInternalFlavors = project.hasProperty('internal')

// Google Services + Crashlytics
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

googleServices {
    missingGoogleServicesStrategy = "ignore"
}

android {
    namespace "com.securecall.app"
    compileSdk 36

    lint {
        // English is the complete fallback locale; incomplete translations stay visible.
        warning 'MissingTranslation'
    }

    defaultConfig {
        applicationId "com.securecall.app"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 78017
        versionName "1.0.50"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Server URLs are defined per buildType (debug/release)
        // See buildTypes below for SIGNAL_WS_URL and STUN_URL.
    }

    flavorDimensions "tier"

    productFlavors {
        free {
            dimension "tier"
            applicationIdSuffix ".free"
            versionNameSuffix "-free"

            buildConfigField "String", "TIER", "\"FREE\""
            buildConfigField "int", "MAX_CALL_DURATION_MINUTES", "15"
            buildConfigField "int", "MAX_CONTACTS", "10"
            buildConfigField "boolean", "DEVICE_ATTESTATION_REQUIRED", "false"
            buildConfigField "boolean", "ROOT_DETECTION_BLOCKS", "false"
            buildConfigField "boolean", "CERTIFICATE_PINNING", "true"
            buildConfigField "boolean", "CALL_RECORDING_ALLOWED", "true"
            buildConfigField "boolean", "TELEMETRY_ENABLED", "true"
            buildConfigField "boolean", "THIRD_PARTY_ANALYTICS", "true"
            buildConfigField "String", "RECONNECT_STRATEGY", "\"basic\""
            buildConfigField "boolean", "MULTI_DEVICE_SUPPORT", "false"
            buildConfigField "boolean", "SCREEN_CAPTURE_DETECTION", "false"
            buildConfigField "boolean", "DEBUGGER_DETECTION", "false"
            buildConfigField "boolean", "EMULATOR_DETECTION", "false"
            buildConfigField "boolean", "HARDWARE_KEYSTORE_REQUIRED", "false"
            // Fix CLIENT-HIGH-002 (2026-04-16): release builds should not emit AppLogger.d/i.
            // Log.d calls are already stripped by ProGuard -assumenosideeffects, but
            // the AppLogger facade checks this string at runtime.
            buildConfigField "String", "LOGGING_LEVEL", "\"WARN\""
            buildConfigField "boolean", "NO_FALLBACK_MODE", "false"
            buildConfigField "boolean", "AGGRESSIVE_KEY_ROTATION", "false"

            // Billing (In-App-Purchase)
            // Finance gate: Play purchases stay closed until PRODUCT_READY and
            // FINANCE_READY are recorded for the same immutable offer version.
            buildConfigField "boolean", "BILLING_ENABLED", "false"
            buildConfigField "boolean", "ACTIVATION_CODE_ENABLED", "false"
            buildConfigField "String", "PLAY_CATALOG_VERSION", "\"securecall-play-v1\""
            buildConfigField "String", "SKU_PRO_MONTHLY", "\"securecall_pro_monthly\""
            buildConfigField "String", "SKU_PRO_YEARLY", "\"securecall_pro_yearly\""
            buildConfigField "String", "SKU_PREMIUM_MONTHLY", "\"securecall_premium_monthly\""
            buildConfigField "String", "SKU_PREMIUM_YEARLY", "\"securecall_premium_yearly\""
            buildConfigField "String", "SKU_PRO_LIFETIME", "\"securecall_pro_lifetime\""
            buildConfigField "String", "SKU_PREMIUM_LIFETIME", "\"securecall_premium_lifetime\""
            buildConfigField "String", "SKU_PREMIUM_ACTIVATION_CODE", "\"securecall_premium_activation_code\""
        }

        pro {
            dimension "tier"
            applicationIdSuffix ".pro"
            versionNameSuffix "-pro"

            buildConfigField "String", "TIER", "\"PRO\""
            buildConfigField "int", "MAX_CALL_DURATION_MINUTES", "0"
            buildConfigField "int", "MAX_CONTACTS", "0"
            buildConfigField "boolean", "DEVICE_ATTESTATION_REQUIRED", "true"
            buildConfigField "boolean", "ROOT_DETECTION_BLOCKS", "true"
            buildConfigField "boolean", "CERTIFICATE_PINNING", "true"
            buildConfigField "boolean", "CALL_RECORDING_ALLOWED", "false"
            buildConfigField "boolean", "TELEMETRY_ENABLED", "false"
            buildConfigField "boolean", "THIRD_PARTY_ANALYTICS", "false"
            buildConfigField "String", "RECONNECT_STRATEGY", "\"aggressive\""
            buildConfigField "boolean", "MULTI_DEVICE_SUPPORT", "true"
            buildConfigField "boolean", "SCREEN_CAPTURE_DETECTION", "false"
            buildConfigField "boolean", "DEBUGGER_DETECTION", "false"
            buildConfigField "boolean", "EMULATOR_DETECTION", "false"
            buildConfigField "boolean", "HARDWARE_KEYSTORE_REQUIRED", "false"
            buildConfigField "String", "LOGGING_LEVEL", "\"WARN\""
            buildConfigField "boolean", "NO_FALLBACK_MODE", "false"
            buildConfigField "boolean", "AGGRESSIVE_KEY_ROTATION", "false"
            buildConfigField "boolean", "BILLING_ENABLED", "false"
            buildConfigField "boolean", "ACTIVATION_CODE_ENABLED", "false"
            buildConfigField "String", "PLAY_CATALOG_VERSION", "\"securecall-play-v1\""
        }

        premium {
            dimension "tier"
            applicationIdSuffix ".premium"
            versionNameSuffix "-premium"

            buildConfigField "String", "TIER", "\"PREMIUM\""
            buildConfigField "int", "MAX_CALL_DURATION_MINUTES", "0"
            buildConfigField "int", "MAX_CONTACTS", "0"
            buildConfigField "boolean", "DEVICE_ATTESTATION_REQUIRED", "true"
            buildConfigField "boolean", "ROOT_DETECTION_BLOCKS", "true"
            buildConfigField "boolean", "CERTIFICATE_PINNING", "true"
            buildConfigField "boolean", "CALL_RECORDING_ALLOWED", "false"
            buildConfigField "boolean", "TELEMETRY_ENABLED", "false"
            buildConfigField "boolean", "THIRD_PARTY_ANALYTICS", "false"
            buildConfigField "String", "RECONNECT_STRATEGY", "\"aggressive\""
            buildConfigField "boolean", "MULTI_DEVICE_SUPPORT", "true"
            buildConfigField "boolean", "SCREEN_CAPTURE_DETECTION", "true"
            buildConfigField "boolean", "DEBUGGER_DETECTION", "true"
            buildConfigField "boolean", "EMULATOR_DETECTION", "true"
            buildConfigField "boolean", "HARDWARE_KEYSTORE_REQUIRED", "true"
            buildConfigField "String", "LOGGING_LEVEL", "\"ERROR_ONLY\""
            buildConfigField "boolean", "NO_FALLBACK_MODE", "true"
            buildConfigField "boolean", "AGGRESSIVE_KEY_ROTATION", "true"
            buildConfigField "boolean", "BILLING_ENABLED", "false"
            buildConfigField "boolean", "ACTIVATION_CODE_ENABLED", "false"
            buildConfigField "String", "PLAY_CATALOG_VERSION", "\"securecall-play-v1\""
        }

    }

    // Suppress pro/premium variants unless -Pinternal is set. The built-in
    // WireGuard service exists only in the premium source set used for direct
    // APK distribution; the Play freeRelease variant never sees that source.
    variantFilter { variant ->
        def flavorName = variant.flavors*.name
        if (!allowInternalFlavors && (flavorName.contains('pro') || flavorName.contains('premium'))) {
            setIgnore(true)
        }
    }

    // ABI splits for store/internal artifacts plus one universal APK for direct website downloads.
    splits {
        abi {
            enable !buildingAppBundle
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("SECURECALL_STORE_FILE") ?: findProperty("SECURECALL_STORE_FILE") ?: "${rootProject.projectDir}/../securecall-release-key.jks")
            storePassword System.getenv("SECURECALL_STORE_PASSWORD") ?: findProperty("SECURECALL_STORE_PASSWORD") ?: ""
            keyAlias System.getenv("SECURECALL_KEY_ALIAS") ?: findProperty("SECURECALL_KEY_ALIAS") ?: "securecall"
            keyPassword System.getenv("SECURECALL_KEY_PASSWORD") ?: findProperty("SECURECALL_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
            // TURN credentials are returned by signaling registration/call setup at runtime.
            // Only public signaling and STUN URLs remain in BuildConfig.
            buildConfigField "String", "SIGNAL_WS_URL", "\"wss://api.stealthx.tech/signal\""
            buildConfigField "String", "STUN_URL", "\"stun:stun.l.google.com:19302\""
        }
        debug {
            minifyEnabled false
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
            buildConfigField "String", "SIGNAL_WS_URL", "\"wss://api.stealthx.tech/signal\""
            buildConfigField "String", "STUN_URL", "\"stun:stun.l.google.com:19302\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        prefab true
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.github.webrtc-sdk:android:125.6422.07'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Material Design 3
    implementation 'com.google.android.material:material:1.9.0'

    // Splash Screen (API 23+ compat)
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // UI Components
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'

    // Google Play Billing (FREE flavor only)
    freeImplementation 'com.android.billingclient:billing:8.2.1'

    // AdMob ads (FREE flavor only)
    freeImplementation 'com.google.android.gms:play-services-ads:23.6.0'
    freeImplementation 'com.google.android.ump:user-messaging-platform:3.0.0'

    // QR Code generation (ZXing)
    implementation 'com.google.zxing:core:3.5.2'

    // Firebase
    freeImplementation platform('com.google.firebase:firebase-bom:32.7.0')
    freeImplementation 'com.google.firebase:firebase-messaging'
    freeImplementation 'com.google.firebase:firebase-crashlytics-ktx'
    proImplementation platform('com.google.firebase:firebase-bom:32.7.0')
    proImplementation 'com.google.firebase:firebase-messaging'
    proImplementation 'com.google.firebase:firebase-crashlytics-ktx'
    premiumImplementation platform('com.google.firebase:firebase-bom:32.7.0')
    premiumImplementation 'com.google.firebase:firebase-messaging'
    premiumImplementation 'com.google.firebase:firebase-crashlytics-ktx'

    // Direct-download Premium APK only. Never add this to implementation or
    // freeImplementation: Google Play's free AAB must remain VpnService-free.
    premiumImplementation 'com.wireguard.android:tunnel:1.0.20260102'

    // Unit Tests (JVM)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.0.0'
    testImplementation 'org.json:json:20230227'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    // Instrumented Tests
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}


// PATCH 215 — native build integration skeleton (Opus JNI codec)
android {
    defaultConfig {
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
        // abiFilters removed — handled by splits.abi block above
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

// ABI-specific versionCodes for split APKs and a higher universal APK code.
// arm64-v8a: base*1000+1, armeabi-v7a: base*1000+2, x86_64: base*1000+3,
// universal: base*1000+9 so direct-download users can update from any split APK.
if (!buildingAppBundle) {
    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def abiCode = 0
            if (abi == "arm64-v8a") abiCode = 1
            else if (abi == "armeabi-v7a") abiCode = 2
            else if (abi == "x86_64") abiCode = 3
            else if (abi == null) abiCode = 9
            if (abiCode > 0) {
                output.versionCodeOverride = variant.versionCode * 1000 + abiCode
            }
        }
    }
}

def nonPremiumVpnPolicySourceFiles = files(
    fileTree('src/main') { include '**/*.xml', '**/*.kt', '**/*.java' },
    fileTree('src/free') { include '**/*.xml', '**/*.kt', '**/*.java' },
    fileTree('src/pro') { include '**/*.xml', '**/*.kt', '**/*.java' },
    fileTree('src/release') { include '**/*.xml', '**/*.kt', '**/*.java' },
    fileTree('src/freeRelease') { include '**/*.xml', '**/*.kt', '**/*.java' }
)
def nonPremiumWireguardCoordinates = providers.provider {
    configurations.findAll { configuration ->
        def name = configuration.name.toLowerCase()
        name.startsWith('free') || name.startsWith('pro')
    }.collectMany { configuration ->
        configuration.allDependencies.findAll { dependency ->
            dependency.group == 'com.wireguard.android'
        }.collect { dependency ->
            "${configuration.name}: ${dependency.group}:${dependency.name}"
        }
    }.sort()
}
def vpnPolicyReport = layout.buildDirectory.file('reports/verification/no-vpn-service.txt').get().asFile

tasks.register('verifyNoVpnServiceSource') {
    group = 'verification'
    description = 'Fails when the Google Play free variant gains VpnService code or tunnel dependencies.'
    inputs.files(nonPremiumVpnPolicySourceFiles)
    inputs.property('wireguardCoordinates', nonPremiumWireguardCoordinates)
    outputs.file(vpnPolicyReport)
    doLast {
        def forbidden = [
            'android.permission.BIND_VPN_SERVICE',
            'android.net.VpnService',
            'com.wireguard.android:tunnel'
        ]
        def violations = []
        nonPremiumVpnPolicySourceFiles.each { candidate ->
            def text = candidate.getText('UTF-8')
            forbidden.each { marker ->
                if (text.contains(marker)) {
                    violations << "${candidate}: ${marker}"
                }
            }
        }
        violations.addAll(nonPremiumWireguardCoordinates.get())
        if (!violations.isEmpty()) {
            throw new GradleException("VpnService policy guard failed:\n" + violations.join('\n'))
        }
        vpnPolicyReport.parentFile.mkdirs()
        vpnPolicyReport.setText('Free and Pro source sets contain no VpnService markers or WireGuard dependencies.\n', 'UTF-8')
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyNoVpnServiceSource')
}

def freeReleaseMergedManifest = layout.buildDirectory.file(
    'intermediates/merged_manifest/freeRelease/processFreeReleaseMainManifest/AndroidManifest.xml'
)

tasks.register('verifyFreeReleaseVpnPolicy') {
    group = 'verification'
    description = 'Verifies the merged Play manifest and resolved runtime graph remain VpnService-free.'
    dependsOn tasks.named('processFreeReleaseMainManifest')
    inputs.file(freeReleaseMergedManifest)
    doLast {
        def manifest = freeReleaseMergedManifest.get().asFile
        if (!manifest.isFile()) {
            throw new GradleException("Merged freeRelease manifest not found: ${manifest}")
        }

        def forbidden = [
            'android.permission.BIND_VPN_SERVICE',
            'android.net.VpnService',
            'com.wireguard.android'
        ]
        def violations = forbidden.findAll { manifest.getText('UTF-8').contains(it) }

        def runtimeViolations = configurations.freeReleaseRuntimeClasspath.incoming
            .resolutionResult.allComponents
            .collect { it.moduleVersion }
            .findAll { it != null && it.group == 'com.wireguard.android' }
            .collect { "${it.group}:${it.name}:${it.version}" }

        if (!violations.isEmpty() || !runtimeViolations.isEmpty()) {
            throw new GradleException(
                'Play freeRelease VPN policy guard failed: ' +
                    (violations + runtimeViolations).join(', ')
            )
        }
    }
}

tasks.matching { it.name == 'bundleFreeRelease' || it.name == 'assembleFreeRelease' }.configureEach {
    dependsOn tasks.named('verifyFreeReleaseVpnPolicy')
}

tasks.register('verifyFreeReleaseBillingClosed') {
    group = 'verification'
    description = 'Fails if Google Play Billing is enabled before both release gates are approved.'
    inputs.files(
        file('build.gradle'),
        file('src/free/java/com/securecall/app/billing/UpgradeActivity.kt'),
        file('src/free/java/com/securecall/app/billing/BillingManager.kt'),
        file('src/free/java/com/securecall/app/billing/PurchaseResultActivity.kt'),
        file('src/main/java/com/securecall/app/config/TierManager.kt'),
        file('src/main/java/com/securecall/app/ui/SettingsFragment.kt')
    )
    doLast {
        def source = file('build.gradle').getText('UTF-8')
        def freeBlock = (source =~ /(?s)free\s*\{.*?buildConfigField\s+"boolean",\s*"BILLING_ENABLED",\s*"(true|false)"/)
        if (!freeBlock.find() || freeBlock.group(1) != 'false') {
            throw new GradleException('Free Play Billing must remain disabled until PRODUCT_READY and FINANCE_READY match.')
        }
        def activationBlock = (source =~ /(?s)free\s*\{.*?buildConfigField\s+"boolean",\s*"ACTIVATION_CODE_ENABLED",\s*"(true|false)"/)
        if (!activationBlock.find() || activationBlock.group(1) != 'false') {
            throw new GradleException('Activation codes must remain disabled until signed client verification is release-ready.')
        }
        def upgradeSource = file('src/free/java/com/securecall/app/billing/UpgradeActivity.kt').getText('UTF-8')
        def managerSource = file('src/free/java/com/securecall/app/billing/BillingManager.kt').getText('UTF-8')
        def resultSource = file('src/free/java/com/securecall/app/billing/PurchaseResultActivity.kt').getText('UTF-8')
        def tierSource = file('src/main/java/com/securecall/app/config/TierManager.kt').getText('UTF-8')
        def settingsSource = file('src/main/java/com/securecall/app/ui/SettingsFragment.kt').getText('UTF-8')
        if (!upgradeSource.contains('BuildConfig.BILLING_ENABLED && isPlayStore') ||
            !managerSource.contains('if (!BuildConfig.BILLING_ENABLED)') ||
            !resultSource.contains('BuildConfig.ACTIVATION_CODE_ENABLED') ||
            !tierSource.contains('BuildConfig.ACTIVATION_CODE_ENABLED') ||
            !settingsSource.contains('BuildConfig.ACTIVATION_CODE_ENABLED')) {
            throw new GradleException('Billing runtime must enforce the closed BuildConfig gate.')
        }
    }
}

tasks.matching { it.name == 'bundleFreeRelease' || it.name == 'assembleFreeRelease' }.configureEach {
    dependsOn tasks.named('verifyFreeReleaseBillingClosed')
}

if (allowInternalFlavors) {
    def proReleaseMergedManifest = layout.buildDirectory.file(
        'intermediates/merged_manifest/proRelease/processProReleaseMainManifest/AndroidManifest.xml'
    )
    def premiumReleaseMergedManifest = layout.buildDirectory.file(
        'intermediates/merged_manifest/premiumRelease/processPremiumReleaseMainManifest/AndroidManifest.xml'
    )

    tasks.register('verifyProReleaseVpnPolicy') {
        group = 'verification'
        description = 'Verifies the direct Pro APK remains VpnService- and WireGuard-free.'
        dependsOn tasks.named('processProReleaseMainManifest')
        inputs.file(proReleaseMergedManifest)
        doLast {
            def manifest = proReleaseMergedManifest.get().asFile
            if (!manifest.isFile()) {
                throw new GradleException("Merged proRelease manifest not found: ${manifest}")
            }
            def forbidden = [
                'android.permission.BIND_VPN_SERVICE',
                'android.net.VpnService',
                'com.wireguard.android'
            ]
            def violations = forbidden.findAll { manifest.getText('UTF-8').contains(it) }
            def runtimeViolations = configurations.proReleaseRuntimeClasspath.incoming
                .resolutionResult.allComponents
                .collect { it.moduleVersion }
                .findAll { it != null && it.group == 'com.wireguard.android' }
                .collect { "${it.group}:${it.name}:${it.version}" }
            if (!violations.isEmpty() || !runtimeViolations.isEmpty()) {
                throw new GradleException(
                    'Pro release VPN policy guard failed: ' +
                        (violations + runtimeViolations).join(', ')
                )
            }
        }
    }

    tasks.register('verifyPremiumReleaseVpnRuntime') {
        group = 'verification'
        description = 'Verifies the direct Premium APK contains both the controller and WireGuard backend services.'
        dependsOn tasks.named('processPremiumReleaseMainManifest')
        inputs.file(premiumReleaseMergedManifest)
        doLast {
            def manifest = premiumReleaseMergedManifest.get().asFile
            if (!manifest.isFile()) {
                throw new GradleException("Merged premiumRelease manifest not found: ${manifest}")
            }
            def text = manifest.getText('UTF-8')
            def required = [
                'com.securecall.app.vpn.PremiumVpnService',
                'com.wireguard.android.backend.GoBackend$VpnService',
                'android.permission.BIND_VPN_SERVICE'
            ]
            def missing = required.findAll { !text.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException('Premium VPN runtime guard failed; missing: ' + missing.join(', '))
            }
        }
    }

    tasks.matching { it.name == 'assemblePremiumRelease' }.configureEach {
        dependsOn tasks.named('verifyPremiumReleaseVpnRuntime')
    }
    tasks.matching { it.name == 'assembleProRelease' }.configureEach {
        dependsOn tasks.named('verifyProReleaseVpnPolicy')
    }
}

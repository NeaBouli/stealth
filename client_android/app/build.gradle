apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace "com.securecall.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.securecall.app"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 13
        versionName "1.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Server URLs are defined per buildType (debug/release)
        // See buildTypes block below for SIGNAL_WS_URL, STUN_URL, TURN_URL, TURNS_URL
    }

    flavorDimensions "tier"

    productFlavors {
        free {
            dimension "tier"
            applicationIdSuffix ".free"
            versionNameSuffix "-free"

            buildConfigField "String", "TIER", "\"FREE\""
            buildConfigField "int", "MAX_CALL_DURATION_MINUTES", "15"
            buildConfigField "int", "MAX_CONTACTS", "10"
            buildConfigField "boolean", "DEVICE_ATTESTATION_REQUIRED", "false"
            buildConfigField "boolean", "ROOT_DETECTION_BLOCKS", "false"
            buildConfigField "boolean", "CERTIFICATE_PINNING", "false"
            buildConfigField "boolean", "CALL_RECORDING_ALLOWED", "true"
            buildConfigField "boolean", "TELEMETRY_ENABLED", "true"
            buildConfigField "boolean", "THIRD_PARTY_ANALYTICS", "true"
            buildConfigField "String", "RECONNECT_STRATEGY", "\"basic\""
            buildConfigField "boolean", "MULTI_DEVICE_SUPPORT", "false"
            buildConfigField "boolean", "SCREEN_CAPTURE_DETECTION", "false"
            buildConfigField "boolean", "DEBUGGER_DETECTION", "false"
            buildConfigField "boolean", "EMULATOR_DETECTION", "false"
            buildConfigField "boolean", "HARDWARE_KEYSTORE_REQUIRED", "false"
            buildConfigField "String", "LOGGING_LEVEL", "\"DEBUG\""
            buildConfigField "boolean", "NO_FALLBACK_MODE", "false"
            buildConfigField "boolean", "AGGRESSIVE_KEY_ROTATION", "false"

            // Billing (In-App-Purchase)
            buildConfigField "boolean", "BILLING_ENABLED", "true"
            buildConfigField "String", "SKU_PRO_MONTHLY", "\"securecall_pro_monthly\""
            buildConfigField "String", "SKU_PRO_YEARLY", "\"securecall_pro_yearly\""
            buildConfigField "String", "SKU_PREMIUM_MONTHLY", "\"securecall_premium_monthly\""
            buildConfigField "String", "SKU_PREMIUM_YEARLY", "\"securecall_premium_yearly\""
            buildConfigField "String", "SKU_PRO_LIFETIME", "\"securecall_pro_lifetime\""
            buildConfigField "String", "SKU_PREMIUM_LIFETIME", "\"securecall_premium_lifetime\""
            buildConfigField "String", "SKU_PREMIUM_ACTIVATION_CODE", "\"securecall_premium_activation_code\""
        }

        pro {
            dimension "tier"
            applicationIdSuffix ".pro"
            versionNameSuffix "-pro"

            buildConfigField "String", "TIER", "\"PRO\""
            buildConfigField "int", "MAX_CALL_DURATION_MINUTES", "0"
            buildConfigField "int", "MAX_CONTACTS", "0"
            buildConfigField "boolean", "DEVICE_ATTESTATION_REQUIRED", "true"
            buildConfigField "boolean", "ROOT_DETECTION_BLOCKS", "true"
            buildConfigField "boolean", "CERTIFICATE_PINNING", "true"
            buildConfigField "boolean", "CALL_RECORDING_ALLOWED", "false"
            buildConfigField "boolean", "TELEMETRY_ENABLED", "false"
            buildConfigField "boolean", "THIRD_PARTY_ANALYTICS", "false"
            buildConfigField "String", "RECONNECT_STRATEGY", "\"aggressive\""
            buildConfigField "boolean", "MULTI_DEVICE_SUPPORT", "true"
            buildConfigField "boolean", "SCREEN_CAPTURE_DETECTION", "false"
            buildConfigField "boolean", "DEBUGGER_DETECTION", "false"
            buildConfigField "boolean", "EMULATOR_DETECTION", "false"
            buildConfigField "boolean", "HARDWARE_KEYSTORE_REQUIRED", "false"
            buildConfigField "String", "LOGGING_LEVEL", "\"WARN\""
            buildConfigField "boolean", "NO_FALLBACK_MODE", "false"
            buildConfigField "boolean", "AGGRESSIVE_KEY_ROTATION", "false"
            buildConfigField "boolean", "BILLING_ENABLED", "false"
        }

        premium {
            dimension "tier"
            applicationIdSuffix ".premium"
            versionNameSuffix "-premium"

            buildConfigField "String", "TIER", "\"PREMIUM\""
            buildConfigField "int", "MAX_CALL_DURATION_MINUTES", "0"
            buildConfigField "int", "MAX_CONTACTS", "0"
            buildConfigField "boolean", "DEVICE_ATTESTATION_REQUIRED", "true"
            buildConfigField "boolean", "ROOT_DETECTION_BLOCKS", "true"
            buildConfigField "boolean", "CERTIFICATE_PINNING", "true"
            buildConfigField "boolean", "CALL_RECORDING_ALLOWED", "false"
            buildConfigField "boolean", "TELEMETRY_ENABLED", "false"
            buildConfigField "boolean", "THIRD_PARTY_ANALYTICS", "false"
            buildConfigField "String", "RECONNECT_STRATEGY", "\"aggressive\""
            buildConfigField "boolean", "MULTI_DEVICE_SUPPORT", "true"
            buildConfigField "boolean", "SCREEN_CAPTURE_DETECTION", "true"
            buildConfigField "boolean", "DEBUGGER_DETECTION", "true"
            buildConfigField "boolean", "EMULATOR_DETECTION", "true"
            buildConfigField "boolean", "HARDWARE_KEYSTORE_REQUIRED", "true"
            buildConfigField "String", "LOGGING_LEVEL", "\"ERROR_ONLY\""
            buildConfigField "boolean", "NO_FALLBACK_MODE", "true"
            buildConfigField "boolean", "AGGRESSIVE_KEY_ROTATION", "true"
            buildConfigField "boolean", "BILLING_ENABLED", "false"
        }

        fdroid {
            dimension "tier"
            applicationIdSuffix ".fdroid"
            versionNameSuffix "-fdroid"

            buildConfigField "String", "TIER", "\"FREE\""
            buildConfigField "int", "MAX_CALL_DURATION_MINUTES", "15"
            buildConfigField "int", "MAX_CONTACTS", "10"
            buildConfigField "boolean", "DEVICE_ATTESTATION_REQUIRED", "false"
            buildConfigField "boolean", "ROOT_DETECTION_BLOCKS", "false"
            buildConfigField "boolean", "CERTIFICATE_PINNING", "false"
            buildConfigField "boolean", "CALL_RECORDING_ALLOWED", "true"
            buildConfigField "boolean", "TELEMETRY_ENABLED", "false"
            buildConfigField "boolean", "THIRD_PARTY_ANALYTICS", "false"
            buildConfigField "String", "RECONNECT_STRATEGY", "\"basic\""
            buildConfigField "boolean", "MULTI_DEVICE_SUPPORT", "false"
            buildConfigField "boolean", "SCREEN_CAPTURE_DETECTION", "false"
            buildConfigField "boolean", "DEBUGGER_DETECTION", "false"
            buildConfigField "boolean", "EMULATOR_DETECTION", "false"
            buildConfigField "boolean", "HARDWARE_KEYSTORE_REQUIRED", "false"
            buildConfigField "String", "LOGGING_LEVEL", "\"DEBUG\""
            buildConfigField "boolean", "NO_FALLBACK_MODE", "false"
            buildConfigField "boolean", "AGGRESSIVE_KEY_ROTATION", "false"
            buildConfigField "boolean", "BILLING_ENABLED", "false"
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("SECURECALL_STORE_FILE") ?: findProperty("SECURECALL_STORE_FILE") ?: "${rootProject.projectDir}/../securecall-release-key.jks")
            storePassword System.getenv("SECURECALL_STORE_PASSWORD") ?: findProperty("SECURECALL_STORE_PASSWORD") ?: ""
            keyAlias System.getenv("SECURECALL_KEY_ALIAS") ?: findProperty("SECURECALL_KEY_ALIAS") ?: "securecall"
            keyPassword System.getenv("SECURECALL_KEY_PASSWORD") ?: findProperty("SECURECALL_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
            // Production server URLs (Railway + Metered.ca)
            // FIX 10 — TODO: TURN credentials are hardcoded. Security risk: credentials in source code.
            // Planned fix: fetch TURN credentials at runtime from the signaling server via
            // a new GET /ice-servers endpoint (already exists, admin-only). Client should call
            // this endpoint on each call initiation and use the returned credentials.
            // TURN credentials are now fetched at runtime from /ice-servers endpoint.
            // Only SIGNAL_WS_URL and STUN_URL remain in BuildConfig.
            buildConfigField "String", "SIGNAL_WS_URL", "\"wss://protective-healing-production.up.railway.app/signal\""
            buildConfigField "String", "STUN_URL", "\"stun:stun.l.google.com:19302\""
        }
        debug {
            minifyEnabled false
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
            buildConfigField "String", "SIGNAL_WS_URL", "\"wss://protective-healing-production.up.railway.app/signal\""
            buildConfigField "String", "STUN_URL", "\"stun:stun.l.google.com:19302\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.github.webrtc-sdk:android:125.6422.07'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Material Design 3
    implementation 'com.google.android.material:material:1.9.0'

    // Splash Screen (API 23+ compat)
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // UI Components
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'

    // WireGuard VPN tunnel (Premium only, uses GoBackend with Noise_IKpsk2)
    implementation 'com.wireguard.android:tunnel:1.0.20260102'

    // WalletConnect v2 — Sign client for IFR token wallet verification
    implementation("com.walletconnect:android-core:1.26.0") {
        exclude group: "org.bouncycastle", module: "bcprov-jdk15on"
    }
    implementation("com.walletconnect:sign:2.26.0") {
        exclude group: "org.bouncycastle", module: "bcprov-jdk15on"
    }

    // Google Play Billing (FREE flavor only)
    freeImplementation 'com.android.billingclient:billing-ktx:6.2.1'

    // AdMob ads (FREE flavor only)
    freeImplementation 'com.google.android.gms:play-services-ads:23.0.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'

    // Unit Tests (JVM)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.0.0'
    testImplementation 'org.json:json:20230227'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    // Instrumented Tests
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Disable google-services and crashlytics plugin for fdroid flavor
afterEvaluate {
    tasks.matching { it.name.contains("Fdroid") && (it.name.contains("GoogleServices") || it.name.contains("Crashlytics")) }.configureEach {
        enabled = false
    }
}

// PATCH 215 — native build integration skeleton
android {
    defaultConfig {
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

# ─── StealthX Landing Page ───────────────────────────────
# Static site hosting for stealthx.app
# Install: sudo cp stealthx.app.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/stealthx.app.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name stealthx.app www.stealthx.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name stealthx.app www.stealthx.app;

    # SSL (managed by certbot)
    # ssl_certificate /etc/letsencrypt/live/stealthx.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/stealthx.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'" always;

    root /opt/securecall/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /privacy {
        try_files /privacy.html =404;
    }
}

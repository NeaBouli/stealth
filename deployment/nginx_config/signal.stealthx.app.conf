# ─── SecureCall Signaling Server ──────────────────────────
# Nginx reverse proxy for WebSocket signaling
# Install: sudo cp signal.stealthx.app.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/signal.stealthx.app.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream signaling_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS redirect (certbot will modify this)
server {
    listen 80;
    server_name signal.stealthx.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS with WebSocket support
server {
    listen 443 ssl http2;
    server_name signal.stealthx.app;

    # SSL certificates (managed by certbot)
    # ssl_certificate /etc/letsencrypt/live/signal.stealthx.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/signal.stealthx.app/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=signaling:10m rate=10r/s;

    # WebSocket endpoint
    location /signal {
        limit_req zone=signaling burst=20 nodelay;

        proxy_pass http://signaling_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WebSocket connections
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # No buffering for real-time
        proxy_buffering off;
        proxy_cache off;
    }

    # REST API endpoints
    location / {
        limit_req zone=signaling burst=10 nodelay;

        proxy_pass http://signaling_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

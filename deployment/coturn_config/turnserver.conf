# ═══════════════════════════════════════════════════════════
# SecureCall — Coturn TURN Server Configuration
# Install: sudo cp turnserver.conf /etc/turnserver.conf
#          sudo systemctl restart coturn
# ═══════════════════════════════════════════════════════════

# ─── Network ─────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# Set your VPS public IP (REQUIRED)
# external-ip=YOUR_VPS_PUBLIC_IP

# Relay port range
min-port=49152
max-port=49200

# ─── Authentication ─────────────────────────────────────
# Use static auth secret (shared between TURN and signaling server)
use-auth-secret
static-auth-secret=CHANGE_ME_GENERATE_WITH_OPENSSL_RAND

# Realm
realm=turn.stealthx.app

# ─── TLS ─────────────────────────────────────────────────
# Uncomment after SSL certs are obtained
# cert=/etc/letsencrypt/live/turn.stealthx.app/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.stealthx.app/privkey.pem

# ─── Security ───────────────────────────────────────────
fingerprint
lt-cred-mech
no-multicast-peers

# Deny relay to private networks
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=0.0.0.0-0.255.255.255

# ─── Quotas ─────────────────────────────────────────────
total-quota=100
stale-nonce=600
max-bps=0

# ─── Logging ────────────────────────────────────────────
no-stdout-log
log-file=/var/log/coturn/turnserver.log
verbose

# ─── Process ────────────────────────────────────────────
no-cli
proc-user=turnserver
proc-group=turnserver

name: Bug Report
description: Report a bug in SecureCall
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.
        **Important:** For security vulnerabilities, please email security@stealthx.app instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open the app
        2. Tap on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: What device are you using?
      placeholder: "e.g. Samsung Galaxy S24, Pixel 8"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android Version
      placeholder: "e.g. Android 14"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      placeholder: "e.g. 0.1-alpha"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or logs.
    validations:
      required: false

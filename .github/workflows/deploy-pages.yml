---
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Verify .well-known files are present for upload
        run: |
          test -f website/.well-known/assetlinks.json
          test -f website/.well-known/security.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Post-deploy .well-known smoke check
        run: |
          for i in 1 2 3 4 5 6; do
            ok=1
            curl -fsSI https://stealthx.tech/.well-known/assetlinks.json >/dev/null || ok=0
            curl -fsSI https://stealthx.tech/.well-known/security.txt >/dev/null || ok=0
            if [ "$ok" = "1" ]; then exit 0; fi
            sleep 10
          done
          echo ".well-known files not reachable after deploy" >&2
          exit 1

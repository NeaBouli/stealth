name: Android Instrumentation

on:
  pull_request:
    branches: [main]
    paths:
      - "client_android/**"
      - ".github/workflows/android-instrumentation.yml"
  workflow_dispatch:
    inputs:
      live_pin_test:
        description: "Run the network-dependent live certificate-pin test (SecureCall endpoints)"
        type: boolean
        default: false
      owned_config_compile_only:
        description: "Run only the owned-test config compile/artifact qualification (no emulator matrix)"
        type: boolean
        default: false
      expected_source_sha:
        description: "Exact 40-hex commit SHA required for owned_config_compile_only"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: securecall-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-tests:
    name: Instrumented Tests API ${{ matrix.api-level }}
    # Excluded only for the explicit manual owned-config compile-only mode.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.owned_config_compile_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]
    defaults:
      run:
        working-directory: client_android
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Enable KVM
        working-directory: ${{ github.workspace }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Free instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          working-directory: client_android
          ndk: 27.0.12077973
          cmake: 3.22.1
          script: >-
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973" &&
            export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME" &&
            ./gradlew --no-daemon --max-workers=1
            assembleFreeDebug assembleFreeDebugAndroidTest --console=plain &&
            bash "${GITHUB_WORKSPACE}/.github/scripts/run-android-smoke.sh"
            "${GITHUB_WORKSPACE}/client_android/app/build/outputs/apk/free/debug/app-free-debug.apk"
            "${GITHUB_WORKSPACE}/client_android/app/build/outputs/apk/androidTest/free/debug/app-free-debug-androidTest.apk"
            com.securecall.app.free.test/androidx.test.runner.AndroidJUnitRunner
            ${{ (github.event_name == 'workflow_dispatch' && inputs.live_pin_test) && 'securecallLivePinTest=true' || '' }}

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: securecall-instrumentation-api-${{ matrix.api-level }}
          path: |
            client_android/**/build/reports/androidTests/**
            client_android/**/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7

  owned-config-compile-only:
    name: Owned Config Compile-Only Qualification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.owned_config_compile_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client_android
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact expected source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          LIVE_PIN_TEST: ${{ inputs.live_pin_test }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "RECEIPT source_sha_format=false"; exit 1; }
          [ "$LIVE_PIN_TEST" = "false" ] || { echo "RECEIPT live_pin_test_off=false"; exit 1; }
          [ "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA" ] || { echo "RECEIPT github_sha_match=false"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA" ] || { echo "RECEIPT head_sha_match=false"; exit 1; }
          echo "RECEIPT source_sha=$EXPECTED_SOURCE_SHA tree=$(git rev-parse 'HEAD^{tree}') match=true"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Compile and inspect owned-config variants
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/owned-config-compile-check.sh"

      - name: Remove throwaway CA and CI-only signing material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/owned-config-compile"

name: TEMP JNI API24 OR PRE-APP PROBE - NEVER MERGE

on:
  workflow_dispatch:
    inputs:
      cache_release_tag:
        description: Owned temporary DRAFT input release tag
        required: false
        type: string
      asset:
        description: Private input tar asset name
        required: false
        type: string
      bundle_sha256:
        description: Parent-verified private input SHA256
        required: false
        type: string
      controller_sha:
        description: Exact reviewed TEMP controller commit
        required: true
        type: string

permissions:
  contents: write # Host-only transfer to the exact owned still-DRAFT release.

concurrency:
  group: temp-sc-jni-final-20261117
  cancel-in-progress: false

# Explicit owner resumption; public preparation/export must pass before private stages.
# No resource, isolation, credential or verification guard is relaxed.

jobs:
  android-client:
    name: Conditional public preparation then offline APK and eight JNI cases
    # Exact parent-reviewed controller; no automatic branch or PR execution.
    if: >-
      github.repository == 'NeaBouli/stealth' && github.event.repository.private == false &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
      github.ref == 'refs/heads/temp/sc-jni-final-20261117' && inputs.controller_sha == github.sha &&
      inputs.cache_release_tag != '' && inputs.asset != '' && inputs.bundle_sha256 != ''
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout reviewed public controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare existing CI KVM access for this runner user only
        run: |
          test -c /dev/kvm
          test ! -e "$RUNNER_TEMP/sc-jni-art-kvm.acl"
          getfacl --numeric --omit-header /dev/kvm > "$RUNNER_TEMP/sc-jni-art-kvm.acl"
          stat -c '%i' /dev/kvm > "$RUNNER_TEMP/sc-jni-art-kvm.inode"
          sudo -n setfacl -m "u:$(id -u):rw" -- /dev/kvm
      - name: Read-only host admission before downloads or private input
        env:
          SC_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          SC_CONTROLLER_SHA: ${{ inputs.controller_sha }}
        run: python3 -I .github/scripts/sc-media-qualification.py admission
      - name: Restore public main Gradle cache only (no Gradle execution)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-read-only: true
          cache-cleanup: never
          dependency-graph: disabled
          build-scan-publish: false
          add-job-summary: never
      - name: Provision public native tools and disposable API24 before private input
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          timeout 360 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 \
            "ndk;27.0.12077973" "cmake;3.22.1" "emulator" \
            "system-images;android-24;google_apis;x86_64"
      - name: Stage exact SHA256-pinned Gradle wrapper archive before private input
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --max-time 180 --max-filesize 268435456 \
            --output "$RUNNER_TEMP/sc-gradle-9.8.0-all.zip" \
            https://services.gradle.org/distributions/gradle-9.8.0-all.zip
          printf '%s  %s\n' \
            46ac66d47f30f3dacfdf306e0b714a91a34fb94a22ba0a744b280933f47bc0cf \
            "$RUNNER_TEMP/sc-gradle-9.8.0-all.zip" | sha256sum --check --status
      - name: Public preparation and guarded conditional private JNI qualification
        env:
          GH_TOKEN: ${{ github.token }}
          SC_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          SC_RELEASE_TAG: ${{ inputs.cache_release_tag }}
          SC_ASSET: ${{ inputs.asset }}
          SC_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          SC_CONTROLLER_SHA: ${{ inputs.controller_sha }}
        run: python3 -I .github/scripts/sc-media-qualification.py hosted
      - name: Exact owned container cgroup and image cleanup fallback
        if: always()
        run: python3 -I .github/scripts/sc-media-qualification.py cleanup
      - name: Restore only this CI KVM device's original ACL
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/sc-jni-art-kvm.acl"; then
            test -c /dev/kvm
            test "$(stat -c '%i' /dev/kvm)" = "$(cat "$RUNNER_TEMP/sc-jni-art-kvm.inode")"
            sudo -n setfacl --set-file="$RUNNER_TEMP/sc-jni-art-kvm.acl" -- /dev/kvm
          fi

  pre-app-probe:
    name: Manual API24 bootstrap, isolation and shutdown only
    # Same registered dispatch path, separate exact temp ref and no input release.
    if: >-
      github.repository == 'NeaBouli/stealth' && github.event.repository.private == false &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
      github.ref == 'refs/heads/temp/sc-jni-preapp-20261118' && inputs.controller_sha == github.sha &&
      inputs.cache_release_tag == '' && inputs.asset == '' && inputs.bundle_sha256 == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SC_CONTROLLER_SHA: ${{ inputs.controller_sha }}
    steps:
      - name: Checkout exact reviewed public controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare existing CI KVM access for this runner user only
        run: |
          umask 077
          test -c /dev/kvm
          test ! -e "$RUNNER_TEMP/sc-jni-art-kvm.acl"
          test ! -e "$RUNNER_TEMP/sc-jni-art-kvm.inode"
          getfacl --numeric --omit-header /dev/kvm > "$RUNNER_TEMP/sc-jni-art-kvm.acl"
          stat -c '%i' /dev/kvm > "$RUNNER_TEMP/sc-jni-art-kvm.inode"
          sudo -n setfacl -m "u:$(id -u):rw" -- /dev/kvm
      - name: Read-only host admission before public SDK provisioning
        env:
          SC_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 -I .github/scripts/sc-media-qualification.py preapp-admission
      - name: Provision only the reviewed public emulator and API24 image
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          timeout 360 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 \
            "emulator" "system-images;android-24;google_apis;x86_64" >/dev/null 2>&1
      - name: Probe isolated API24 before application input or installation
        env:
          SC_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 -I .github/scripts/sc-media-qualification.py preapp-probe
      - name: Check and clean only this run's owned headless scope
        if: always()
        env:
          SC_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 -I .github/scripts/sc-media-qualification.py preapp-cleanup
      - name: Restore and verify this runner's original KVM ACL
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/sc-jni-art-kvm.acl"; then
            test -c /dev/kvm
            test "$(stat -c '%i' /dev/kvm)" = "$(cat "$RUNNER_TEMP/sc-jni-art-kvm.inode")"
            sudo -n setfacl --set-file="$RUNNER_TEMP/sc-jni-art-kvm.acl" -- /dev/kvm
            getfacl --numeric --omit-header /dev/kvm | cmp - "$RUNNER_TEMP/sc-jni-art-kvm.acl"
          fi

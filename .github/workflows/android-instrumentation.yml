name: Android Instrumentation

on:
  pull_request:
    branches: [main]
    paths:
      - "client_android/**"
      - ".github/workflows/android-instrumentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securecall-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-tests:
    name: Instrumented Tests API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]
    defaults:
      run:
        working-directory: client_android
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android build dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Run Free instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          working-directory: client_android
          ndk: 27.0.12077973
          cmake: 3.22.1
          script: |
            set -eu
            ./gradlew --no-daemon --max-workers=1 assembleFreeDebug assembleFreeDebugAndroidTest --console=plain
            timeout 600 adb install --no-streaming -r -t -g app/build/outputs/apk/free/debug/app-free-debug.apk
            timeout 600 adb install --no-streaming -r -t -g app/build/outputs/apk/androidTest/free/debug/app-free-debug-androidTest.apk
            result="$(mktemp)"
            trap 'rm -f "$result"' EXIT
            adb shell am instrument -w -r \
              com.securecall.app.free.test/androidx.test.runner.AndroidJUnitRunner | tee "$result"
            grep -Eq '^OK \([1-9][0-9]* tests?\)$' "$result"

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: securecall-instrumentation-api-${{ matrix.api-level }}
          path: |
            client_android/**/build/reports/androidTests/**
            client_android/**/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7

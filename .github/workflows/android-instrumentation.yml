name: TEMP Node authenticated-call - PARENT QUALIFICATION PENDING - NEVER MERGE

on:
  workflow_dispatch:
    inputs:
      cache_release_tag:
        description: Owned temporary DRAFT input release tag
        required: true
        type: string
      asset:
        description: Private input tar asset name
        required: true
        type: string
      bundle_sha256:
        description: Parent-verified private input SHA256
        required: true
        type: string
      controller_sha:
        description: Exact reviewed TEMP controller commit
        required: true
        type: string

permissions:
  contents: write # Trusted transfer to the owned temporary DRAFT only.

concurrency:
  group: temp-sc-stx24-node-hosted-20261117
  cancel-in-progress: false

jobs:
  node-authenticated-call:
    name: TEMP isolated offline Node authenticated-call only
    if: github.repository == 'NeaBouli/stealth' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.ref == 'refs/heads/temp/sc-stx24-node-hosted-20261117' && inputs.controller_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed public controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Trusted bootstrap and bounded offline qualification
        env:
          GH_TOKEN: ${{ github.token }}
          SC_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          SC_RELEASE_TAG: ${{ inputs.cache_release_tag }}
          SC_ASSET: ${{ inputs.asset }}
          SC_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          SC_CONTROLLER_SHA: ${{ inputs.controller_sha }}
        run: python3 -I .github/scripts/sc-media-qualification.py hosted
      - name: Exact owned resource cleanup fallback
        if: always()
        run: python3 -I .github/scripts/sc-media-qualification.py cleanup

name: Android Instrumentation

on:
  pull_request:
    branches: [main]
    paths:
      - "client_android/**"
      - ".github/workflows/android-instrumentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securecall-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-tests:
    name: Instrumented Tests API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]
    defaults:
      run:
        working-directory: client_android
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android build dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Enable KVM
        working-directory: ${{ github.workspace }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create and boot emulator
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          ADB="$ANDROID_HOME/platform-tools/adb"
          image="system-images;android-${{ matrix.api-level }};google_apis;x86_64"
          "$SDKMANAGER" "platform-tools" "emulator" "$image"
          echo no | "$AVDMANAGER" create avd --force --name ci-device --package "$image" --device pixel_2
          nohup "$EMULATOR" -avd ci-device -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot > "${RUNNER_TEMP}/emulator.log" 2>&1 &
          "$ADB" wait-for-device
          deadline=$((SECONDS + 300))
          until [[ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; do
            (( SECONDS < deadline )) || { cat "${RUNNER_TEMP}/emulator.log"; exit 1; }
            sleep 5
          done
          "$ADB" shell input keyevent 82

      - name: Run Free instrumented tests
        run: ./gradlew --no-daemon --max-workers=1 connectedFreeDebugAndroidTest --console=plain

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: securecall-instrumentation-api-${{ matrix.api-level }}
          path: |
            client_android/**/build/reports/androidTests/**
            client_android/**/build/outputs/androidTest-results/**
            ${{ runner.temp }}/emulator.log
          if-no-files-found: warn
          retention-days: 7

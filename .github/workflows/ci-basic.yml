---
name: Basic CI

on:
  push:
    branches: ["main", "dev", "feature/**"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: stealth-basic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Markdown & YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install linters
        run: |
          pip install yamllint

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify closed browser checkout gate
        run: |
          node --check website/js/ifr-checkout.js
          node --test website/js/ifr-checkout.test.cjs

      - name: Run YAML Lint
        run: yamllint .

  signaling-tests:
    name: Signaling Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/signaling
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/signaling/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run signaling tests
        run: npm test

  rust-core:
    name: Rust Core Crypto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core_crypto
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up stable Rust with Clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Test locked dependency graph
        run: cargo test --locked --all-targets

      - name: Lint locked dependency graph
        run: cargo clippy --locked --all-targets -- -D warnings

  android-client:
    name: Android Client
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client_android
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android build dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Verify Android client
        run: |
          export SECURECALL_STORE_FILE="${RUNNER_TEMP}/securecall-ci-only.jks"
          export SECURECALL_STORE_PASSWORD="$(openssl rand -hex 24)"
          export SECURECALL_KEY_ALIAS="securecall-ci"
          export SECURECALL_KEY_PASSWORD="$SECURECALL_STORE_PASSWORD"
          keytool -genkeypair -noprompt \
            -keystore "$SECURECALL_STORE_FILE" \
            -storepass "$SECURECALL_STORE_PASSWORD" \
            -keypass "$SECURECALL_KEY_PASSWORD" \
            -alias "$SECURECALL_KEY_ALIAS" \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname "CN=CI Verification Only"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 -Pinternal \
            testFreeDebugUnitTest \
            testPremiumDebugUnitTest \
            compilePremiumDebugSources \
            verifyProReleaseVpnPolicy \
            verifyPremiumReleaseVpnRuntime \
            lintFreeRelease \
            verifyNoAppIfrWalletCode \
            assembleFreeDebug \
            assembleFreeRelease \
            bundleFreeRelease \
            --console=plain
          aab="app/build/outputs/bundle/freeRelease/app-free-release.aab"
          mapfile -t apks < <(find app/build/outputs/apk/free/release -maxdepth 1 \
            -name '*.apk' -type f | sort)
          test "${#apks[@]}" -gt 0
          test -s "$aab"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f \
            | sort -V | tail -1)"
          test -n "$APKSIGNER"
          for apk in "${apks[@]}"; do
            test -s "$apk"
            unzip -tq "$apk"
            "$APKSIGNER" verify "$apk"
          done
          unzip -tq "$aab"
          jarsigner -verify "$aab"
          entries="$(unzip -Z1 "$aab")"
          grep -Eq '^META-INF/[^/]+\.SF$' <<< "$entries"
          grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$' <<< "$entries"

      - name: Remove ephemeral signing material
        if: always()
        run: rm -f "${RUNNER_TEMP}/securecall-ci-only.jks"

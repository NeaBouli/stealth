---
name: Basic CI

on:
  push:
    branches: ["main", "dev", "feature/**"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint Markdown & YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install linters
        run: |
          pip install yamllint

      - name: Run YAML Lint
        run: yamllint .

  signaling-tests:
    name: Signaling Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/signaling
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/signaling/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run signaling tests
        run: npm test

  android-client:
    name: Android Client
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client_android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: client_android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Verify Android client
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 \
            testFreeDebugUnitTest \
            lintFreeRelease \
            verifyNoAppIfrWalletCode \
            assembleFreeDebug \
            --console=plain

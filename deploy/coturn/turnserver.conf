# ─── SecureCall TURN Server (coturn) Configuration ────────

# ─── Network ─────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# External IP — set to VPS public IP (required for coturn behind NAT)
# external-ip=135.181.254.229

# Relay port range (must match docker-compose port mapping)
min-port=49152
max-port=49200

# ─── Authentication ─────────────────────────────────────
# RFC 8489 HMAC-based time-limited credentials.
# Matches server.js getIceServers() HMAC-SHA1 generation.
# TURN_SECRET must be set identically in signaling and coturn containers.
use-auth-secret
static-auth-secret=$TURN_SECRET

# Realm (must match TURN_HOST domain)
realm=stealthx.tech

# ─── TLS ─────────────────────────────────────────────────
cert=/etc/letsencrypt/live/stealthx.tech/fullchain.pem
pkey=/etc/letsencrypt/live/stealthx.tech/privkey.pem

# ─── Security ───────────────────────────────────────────
# Disable multicast peers
no-multicast-peers

# Deny specific IP ranges (prevent relay to internal networks)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Fingerprint for STUN messages
fingerprint

# ─── Logging ─────────────────────────────────────────────
# Log to stdout (Docker will capture)
log-file=stdout

# Verbose logging (disable in production for performance)
# verbose

# ─── Performance ─────────────────────────────────────────
# Total relay bandwidth limit (bytes/s) — 0 = unlimited
# max-bps=0

# Per-session bandwidth limit
# bps-capacity=0

# Stale nonce lifetime (seconds)
stale-nonce=600

# No CLI (not needed in Docker)
no-cli

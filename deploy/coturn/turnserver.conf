# ─── SecureCall TURN Server (coturn) Configuration ────────

# ─── Network ─────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# External IP (replace with your VPS public IP)
# external-ip=YOUR_VPS_PUBLIC_IP

# Relay port range (must match docker-compose port mapping)
min-port=49152
max-port=49200

# ─── Authentication ─────────────────────────────────────
# Long-term credential mechanism
lt-cred-mech

# Realm (must match TURN_REALM env var)
realm=securecall.app

# Static user (set via environment or use turnadmin for dynamic)
# user=securecall:CHANGE_ME_TO_A_SECURE_PASSWORD
# Better: use --user flag or TURN_USER/TURN_PASS env vars

# ─── TLS ─────────────────────────────────────────────────
# Uncomment when Let's Encrypt certs are available
# cert=/etc/letsencrypt/live/turn.securecall.app/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.securecall.app/privkey.pem

# ─── Security ───────────────────────────────────────────
# Disable multicast peers
no-multicast-peers

# Deny specific IP ranges (prevent relay to internal networks)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Fingerprint for STUN messages
fingerprint

# ─── Logging ─────────────────────────────────────────────
# Log to stdout (Docker will capture)
log-file=stdout

# Verbose logging (disable in production for performance)
# verbose

# ─── Performance ─────────────────────────────────────────
# Total relay bandwidth limit (bytes/s) — 0 = unlimited
# max-bps=0

# Per-session bandwidth limit
# bps-capacity=0

# Stale nonce lifetime (seconds)
stale-nonce=600

# No CLI (not needed in Docker)
no-cli

# ─── HTTP → HTTPS Redirect ────────────────────────────────
server {
    listen 80;
    server_name signal.securecall.app stealthx.app www.stealthx.app;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Signaling Server (WSS) ──────────────────────────────
server {
    listen 443 ssl http2;
    server_name signal.securecall.app;

    # ─── SSL Certificates ────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/signal.securecall.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signal.securecall.app/privkey.pem;

    # ─── SSL Configuration ───────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ─── HSTS ────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ─── WebSocket Proxy ─────────────────────────────────
    location /signal {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://signaling;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Buffer settings
        proxy_buffering off;
        proxy_cache off;
    }

    # ─── REST API Proxy ──────────────────────────────────
    location / {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://signaling;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Landing Page (stealthx.app) ─────────────────────────
server {
    listen 443 ssl http2;
    server_name stealthx.app www.stealthx.app;

    # ─── SSL Certificates ────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/stealthx.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stealthx.app/privkey.pem;

    # ─── SSL Configuration ───────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ─── HSTS ────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ─── Content Security Policy ─────────────────────────
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'" always;

    # ─── Static Files ────────────────────────────────────
    root /var/www/website;
    index index.html;

    location / {
        limit_req zone=general burst=30 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # ─── Cache Static Assets ─────────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Privacy Policy (direct URL) ─────────────────────
    location = /privacy {
        try_files /privacy.html =404;
    }
}
